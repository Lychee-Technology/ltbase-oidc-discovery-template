name: Publish OIDC Discovery Documents

on:
  workflow_dispatch:
    inputs:
      target_stack:
        description: "Stack to publish ('all' or a specific stack name)"
        required: false
        default: "all"
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      PAGES_DEPLOY_BRANCH: ${{ vars.OIDC_DISCOVERY_PAGES_BRANCH || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.DEFAULT_BRANCH }}

      - name: Generate discovery documents
        env:
          OIDC_DISCOVERY_DOMAIN: ${{ vars.OIDC_DISCOVERY_DOMAIN }}
          OIDC_DISCOVERY_STACK_CONFIG: ${{ vars.OIDC_DISCOVERY_STACK_CONFIG }}
          TARGET_STACK: ${{ inputs.target_stack }}
          OIDC_DISCOVERY_OUTPUT_DIR: ${{ runner.temp }}/discovery-output
        run: scripts/build-discovery.sh

      - name: Commit discovery docs
        id: commit_discovery
        env:
          OIDC_DISCOVERY_OUTPUT_DIR: ${{ runner.temp }}/discovery-output
          TARGET_STACK: ${{ inputs.target_stack }}
        run: |
          set -euo pipefail

          output_dir="${OIDC_DISCOVERY_OUTPUT_DIR}"
          current_manifest="${RUNNER_TEMP}/oidc-current-stack-dirs.txt"
          removed_manifest="${RUNNER_TEMP}/oidc-removed-stack-dirs.txt"
          rm -f "${current_manifest}" "${removed_manifest}"
          # Ensure manifests exist so later reads never fail under set -e.
          : > "${current_manifest}"
          : > "${removed_manifest}"

          # Build current-stack manifest from output dir.
          shopt -s nullglob
          for stack_dir in "${output_dir}"/*/; do
            stack_dir=${stack_dir%/}
            stack_name="${stack_dir##*/}"
            if [[ -f "${stack_dir}/.well-known/openid-configuration" && -f "${stack_dir}/.well-known/jwks.json" ]]; then
              printf '%s\n' "${stack_name}" >> "${current_manifest}"
            fi
          done
          shopt -u nullglob

          # Detect removed stacks only on a full publish. A single-stack publish
          # must leave other committed stacks untouched.
          if [[ "${TARGET_STACK:-all}" == "all" ]]; then
            declare -A current_set=()
            while IFS= read -r s; do
              [[ -n "${s}" ]] && current_set["${s}"]=1
            done < "${current_manifest}"

            shopt -s nullglob
            for stack_dir in */; do
              stack_dir=${stack_dir%/}
              if [[ -f "${stack_dir}/.well-known/openid-configuration" && -f "${stack_dir}/.well-known/jwks.json" ]] && [[ -z "${current_set["${stack_dir}"]+x}" ]]; then
                rm -rf "${stack_dir}"
                printf '%s\n' "${stack_dir}" >> "${removed_manifest}"
                echo "Removed stale stack: ${stack_dir}"
              fi
            done
            shopt -u nullglob
          fi

          # Copy generated files from output dir to repo root.
          while IFS= read -r stack_dir; do
            [[ -n "${stack_dir}" ]] || continue
            rsync -a --delete "${output_dir}/${stack_dir}/" "${stack_dir}/"
          done < "${current_manifest}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          while IFS= read -r stack_dir; do
            [[ -n "${stack_dir}" ]] || continue
            git add -A -- "${stack_dir}"
          done < "${current_manifest}"

          while IFS= read -r stack_dir; do
            [[ -n "${stack_dir}" ]] || continue
            git add -A -- "${stack_dir}"
          done < "${removed_manifest}"

          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git commit -m "chore: update OIDC discovery documents"
          local_commit_sha=$(git rev-parse HEAD)
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"
          git cherry-pick "${local_commit_sha}"
          commit_sha=$(git rev-parse HEAD)
          git push origin HEAD:${DEFAULT_BRANCH}
          echo "committed=true" >> "${GITHUB_OUTPUT}"
          echo "commit_sha=${commit_sha}" >> "${GITHUB_OUTPUT}"

      - name: Deploy to Cloudflare Pages
        id: deploy_pages
        timeout-minutes: 10
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          OIDC_DISCOVERY_PAGES_PROJECT: ${{ vars.OIDC_DISCOVERY_PAGES_PROJECT }}
          OIDC_DISCOVERY_OUTPUT_DIR: ${{ runner.temp }}/discovery-output
        run: |
          set -euo pipefail

          output_dir="${OIDC_DISCOVERY_OUTPUT_DIR}"

          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN repo secret is not set"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID repo variable is not set"
            exit 1
          fi
          if [[ -z "${OIDC_DISCOVERY_PAGES_PROJECT}" ]]; then
            echo "::error::OIDC_DISCOVERY_PAGES_PROJECT repo variable is not set"
            exit 1
          fi

          # Build site dir from output dir (excluding _headers which wrangler handles).
          site_dir=$(mktemp -d)
          shopt -s nullglob
          for item in "${output_dir}"/*/; do
            item=${item%/}
            cp -R "${item}" "${site_dir}/"
          done
          for item in "${output_dir}"/_headers; do
            if [[ -f "${item}" ]]; then
              cp "${item}" "${site_dir}/"
            fi
          done
          shopt -u nullglob

          if [[ -z "$(ls -A "${site_dir}")" ]]; then
            echo "::error::No generated stack content found to deploy"
            exit 1
          fi

          npm install --global wrangler@3.114.17
          wrangler pages deploy "${site_dir}" --project-name "${OIDC_DISCOVERY_PAGES_PROJECT}" --branch "${PAGES_DEPLOY_BRANCH}"

      - name: Revert pushed discovery docs on deploy failure
        if: ${{ failure() && steps.commit_discovery.outputs.committed == 'true' && steps.deploy_pages.outcome == 'failure' }}
        run: |
          set -euo pipefail
          commit_sha="${{ steps.commit_discovery.outputs.commit_sha }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "${DEFAULT_BRANCH}"
          git checkout -B "${DEFAULT_BRANCH}" "origin/${DEFAULT_BRANCH}"

          if ! git merge-base --is-ancestor "${commit_sha}" HEAD; then
            echo "::error::Pushed discovery commit ${commit_sha} is no longer reachable from origin/${DEFAULT_BRANCH}; cannot auto-revert"
            exit 1
          fi

          git revert --no-edit "${commit_sha}"
          git push origin HEAD:${DEFAULT_BRANCH}
